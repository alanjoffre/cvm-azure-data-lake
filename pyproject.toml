[project]
name = "cvm-azure-data-lake"
version = "0.1.0"
description = "Carga incremental do Informe Diário de fundos da CVM desenhada para a Azure: ADF, ADLS Gen2 (bronze, prata e ouro), Function com DuckDB, Terraform e Azure Pipelines. Reprocessa os meses que a CVM republica sem duplicar nem perder linha: 32/32 checagens com 3 meses reais. Desenho de referência, validado localmente; não aplicado na Azure."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["duckdb>=2.0"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
cvm-lake = "cvm_lake.cli:main"

[project.optional-dependencies]
azure = [
    "azure-functions>=1.26.0",
    "azure-identity>=1.27.0",
    "azure-storage-file-datalake>=12.26.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PTH"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "funcao_azure", "ci/funcao", "ci/deploy"]
mypy_path = "funcao_azure"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["funcao_azure"]
addopts = "-ra"
